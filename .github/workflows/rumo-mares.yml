name: Rumo - tábuas de maré

on:
  push:
    branches: [claude/rumo-mares]
    paths: ['rumo/tools/**', '.github/workflows/rumo-mares.yml']

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pdfplumber && sudo apt-get install -y -q poppler-utils > /dev/null
      - run: cd rumo/tools && python diag.py "https://assets.marinha.mil.br/chm/sites/www.marinha.mil.br.chm/files/dados_de_mare/40%20-%20PORTO%20DO%20RIO%20DE%20JANEIRO%20-%20I%20FISCAL%20-%20130%20-%20132.pdf"
